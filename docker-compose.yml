services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CAURIS_DB_PATH: /app/data/cauris.sqlite
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - cauris-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/connexion').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  proxy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  cauris-data:
  caddy-data:
  caddy-config:
